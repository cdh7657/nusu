<style>
/* 대원설비건축 · 간판 디자인: 황토 간판 블록 + 고동 글씨 + 로고 물결 파랑 */
:root{
  --paper:#ffffff;--mist:#f1f0ec;--ink:#24180e;--ink2:#5b4a3a;--muted:#8a7c6e;--line:#e7e3dc;
  --ochre:#e3a73b;--ochre-deep:#a8721a;--ochre-soft:#fbefd5;--on-ochre:#24180e;
  --water:#1e5fd0;--water-soft:#e8effc;--danger:#c23a22;--ok:#2e7d4f;--ok-soft:#e6f2ea;--shade:rgba(20,14,8,.5);
  --disp:"Black Han Sans","Pretendard Variable",Pretendard,sans-serif;
  --body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a140f;--mist:#0f0b08;--ink:#f4ece0;--ink2:#d6c8b6;--muted:#a3937f;--line:#30271e;
  --ochre:#e8ae45;--ochre-deep:#e8ae45;--ochre-soft:#3a2a12;--on-ochre:#24180e;
  --water:#7fa6ff;--water-soft:#18233a;--danger:#ff7a5c;--ok:#6fcf98;--ok-soft:#15291e;--shade:rgba(0,0,0,.65);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
p{margin:0}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:0}
h2{font-size:18px;font-weight:800}
h3{font-size:16px;font-weight:800}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
/* 상단 */
.appbar{position:sticky;top:0;z-index:12;background:var(--paper);border-bottom:1px solid var(--line)}
.appbar .in{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center}
.card-id{display:flex;align-items:center;gap:9px}
.card-id img{display:block;width:34px;height:auto}
.card-id b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.1;color:var(--ink);letter-spacing:.01em}
.card-id span{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card-id img{background:#f4ece0;border-radius:6px;padding:2px}}
/* 몸통: 흰 구역 + 회색 구분띠 */
.wrap{max-width:560px;margin:0 auto;padding:0 0 110px;display:flex;flex-direction:column;gap:10px}
main{display:flex;flex-direction:column;gap:10px}
.box,.ptitle{background:var(--paper);padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.ptitle{padding:26px 18px 6px;gap:6px;margin-bottom:-10px}
.ptitle+.box,.ptitle+form>.box:first-child,.ptitle+.chips{padding-top:16px}
.box.soft{background:var(--ochre-soft)}
.box.warn{background:var(--ochre-soft)}
.box.ok{background:var(--ok-soft)}
.sec{padding:14px 18px 0;margin-bottom:-4px}
.sec h2{font-size:15px;font-weight:800;color:var(--ink2)}
/* 간판 블록 (홈) */
.hero{background:var(--ochre);color:var(--on-ochre);padding:30px 20px 34px;gap:14px;position:relative;overflow:hidden}
.hero .hi{font-size:14px;font-weight:700;color:#4a3214}
.hero .big{font-family:var(--disp);font-size:44px;line-height:1.12;color:var(--on-ochre);margin:2px 0 4px}
.hero .intro{font-size:15px;line-height:1.7;color:#3b2810}
.hero .one2{font-size:15.5px;font-weight:800;color:#24180e;margin-top:-6px}
.hero .one{font-size:15.5px;font-weight:600;line-height:1.6;color:#3b2810;max-width:30em}
.hero .intro b{color:var(--on-ochre);font-weight:800}
.hero .btn.hot{background:var(--on-ochre);border-color:var(--on-ochre);color:#fff;margin-top:6px}
.hero .wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:16px;display:block}
.hero .drop{position:absolute;right:-18px;top:18px;width:150px;height:150px;opacity:.16;pointer-events:none}
.intro{display:flex;flex-direction:column;gap:8px}
/* 입력 */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label,.lbl{font-size:15px;font-weight:800;color:var(--ink)}
.field .lbl .sub,.field label .sub{font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--mist);border:2px solid transparent;border-radius:12px;padding:12px 14px;min-height:50px;transition:border-color .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--paper)}
input[readonly]{color:var(--ink2)}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none;margin:0;accent-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
.addr{display:grid;grid-template-columns:1fr auto;gap:8px}
.addr button{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:0 16px;cursor:pointer;white-space:nowrap}
/* 버튼 */
.btn{font:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:15px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-align:center;display:block;width:100%;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.hot{background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:17px;padding:16px}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;display:inline-block;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 .btn{padding:18px 8px;font-size:17px}
button:focus-visible,a:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.err{color:var(--danger);font-size:14px;font-weight:700}
/* 고르기 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:800}
.ptitle+.chips{background:var(--paper);padding:14px 18px 18px;margin:0}
.svc3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.svc5{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.svc3 button,.svc5 button{font:inherit;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;cursor:pointer;text-align:center}
.svc3 button{padding:18px 4px;font-family:var(--disp);font-size:19px;line-height:1.2}
.svc5 button{padding:13px 6px;font-size:15px;font-weight:700;color:var(--ink2)}
.svc3 button.on,.svc5 button.on{border-color:var(--ochre);background:var(--ochre);color:var(--on-ochre)}
.step{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center}
.step button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer}
.step b{min-width:28px;text-align:center;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 136px 46px;gap:8px;align-items:center}.cand input{min-width:0}
.cand button{height:50px;border:0;background:var(--mist);color:var(--muted);border-radius:12px;font:inherit;cursor:pointer}
.busy{margin:0;font-size:13.5px;color:var(--ochre-deep);font-weight:700}
.num{font-family:var(--disp);font-weight:400;color:var(--ochre-deep);font-size:22px;margin-right:8px;vertical-align:-2px}
/* 사진 */
.phs{display:flex;flex-wrap:wrap;gap:8px}.phs:empty{display:none}
.phs .ph{position:relative;width:88px;height:88px}.phs img{width:88px;height:88px;object-fit:cover;border-radius:10px}
.phs button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:15px;line-height:1;cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--mist)}
.cmp .ph0{width:100%;aspect-ratio:1/1;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;font-weight:700;text-align:center;padding:8px;background:var(--mist)}
.cmp figcaption{font-size:13px;color:var(--muted);text-align:center}
/* 목록: 흰 바탕에 구분선 */
.list{display:flex;flex-direction:column;background:var(--paper)}
main>.list,main>button.item,main>.item{margin:0}
.item{display:flex;gap:12px;align-items:center;background:var(--paper);border:0;border-bottom:1px solid var(--line);padding:15px 18px;text-align:left;font:inherit;color:inherit;width:100%;position:relative}
.list .item:last-child{border-bottom:0}
.item::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.item.ok::before{background:var(--ok)}.item.hot::before{background:var(--ochre)}
.box .list{margin:0 -18px}
.item .m{flex:1;min-width:0}.item .t{font-weight:800;overflow-wrap:anywhere}.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
button.item{cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:var(--ochre-soft);color:var(--ochre-deep);white-space:nowrap;vertical-align:1px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.house{display:flex;flex-direction:column;gap:10px}
.house .hn{font-family:var(--disp);font-size:26px;line-height:1.2}
.kv{display:flex;flex-wrap:wrap;gap:6px}.kv span{font-size:13px;font-weight:600;background:var(--mist);border-radius:6px;padding:4px 9px;color:var(--ink2)}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink2)}
ol.how li::marker{font-weight:800;color:var(--ochre-deep)}
.lnk{font:inherit;background:none;border:0;color:var(--water);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;font-weight:600}
.shr{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
/* 우리 동네 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles button{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--mist);border:0;border-radius:12px;padding:16px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.tiles button:active{background:var(--ochre-soft)}
.tiles svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}
.search button{font:inherit;font-weight:800;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:0 20px;cursor:pointer}
/* 아래 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px env(safe-area-inset-bottom,0px)}
nav.tabs button{font:inherit;font-size:11.5px;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ochre)}
/* 시트 */
.sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fd .15s ease-out}
.sheet .in{background:var(--paper);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 18px max(22px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
.sheet .in .box{padding:16px;border-radius:12px}
.sheet .hd{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:18px 0 8px;z-index:2}
.sheet .hd h2{font-family:var(--disp);font-weight:400;font-size:22px}
.sheet .hd .btn{width:auto;padding:8px 14px;font-size:14px}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet .in{animation:none}}
#pcEmbed{height:420px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:50;max-width:90%;text-align:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
details{font-size:14px;color:var(--muted)}details summary{cursor:pointer;color:var(--ink2);font-weight:700}details p{margin:8px 0 0}
.empty{padding:20px 18px;color:var(--muted);background:var(--paper);font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:16px}
main>details{background:var(--paper);padding:16px 18px}
.sic{display:block;width:26px;height:26px;margin:0 auto 6px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svc3 button .sic{color:var(--water)}.svc3 button.on .sic{color:var(--on-ochre)}
.flow{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.flow::before{content:"";position:absolute;top:9px;left:12.5%;right:12.5%;height:2px;background:var(--line)}
.flow li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);position:relative}
.flow li i{width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--line);z-index:1}
.flow li.done{color:var(--ink)}.flow li.done i{background:var(--ochre);border-color:var(--ochre)}
.flow li.next i{border-color:var(--ochre)}
.menu{background:var(--paper);display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:14px;padding:17px 18px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow>svg{width:24px;height:24px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mrow .m{flex:1;min-width:0;display:flex;flex-direction:column}.mrow .t{font-weight:800}.mrow .s{font-size:13px;color:var(--muted)}
.mrow .chev{width:18px;height:18px;stroke:var(--muted)}
.sheet .in>a.btn{margin:0}
.share3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}.share3 .btn{padding:13px 6px;font-size:15px}
#bkF>.btn,#bkF>.err{margin:0 16px;width:auto}
#bkF>.btn{margin-top:2px}
#inapp{margin:0}
</style></head><body>

(function(){
"use strict";
var DB_URL="https://daewon-booking-default-rtdb.asia-southeast1.firebasedatabase.app";
var PAGE="https://cdh7657.github.io/nusu/";
var KEY="jr2";
var $=function(s){return document.querySelector(s);};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var dg=function(s){return String(s||"").replace(/\D/g,"");};
var fmtTel=function(s){var d=dg(s);if(d.length===11)return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);if(d.length===10)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);return s||"";};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var today=function(){return iso(new Date());};
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d);}
var WD="일월화수목금토";
function dshow(t){var d=new Date(String(t).slice(0,10)+"T00:00");if(isNaN(d))return t;return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"+(String(t).length>10?" "+String(t).slice(11):"");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(t){var r=$("#toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){r.innerHTML="";},2600);}

/* ---------- 저장 (이 폰에만) ---------- */
var S;
function blank(){return {v:2,me:null,houses:[],reqs:[],checks:[],pending:{},consent:false,createdAt:Date.now()};}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||"null");S=j&&j.v===2?j:blank();}catch(e){S=blank();}
  if(!S.houses)S.houses=[];if(!S.reqs)S.reqs=[];if(!S.checks)S.checks=[];if(!S.pending)S.pending={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){toast("저장 공간이 가득 찼어요. 오래된 점검 기록을 지워 주세요");return false;}}
load();

/* ---------- 상수 ---------- */
var INTRO_P='<p>집을 관리하다 보면 크고 작은 일 앞에서<br>"어디에 물어봐야 하지, 누구에게 맡겨야 하지" 고민되고 걱정되실 때가 많으시죠.</p><p><b>대원설비건축이 그 걱정을 덜어드리겠습니다.</b><br>설비는 저희가 직접, 그 밖의 집 관리는 믿고 맡길 수 있는 곳을 함께 찾아 연결해 드립니다.</p>';
var HERO_DECO='<svg class="drop" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6C50 6 18 46 18 65a32 32 0 0 0 64 0C82 46 50 6 50 6z" fill="none" stroke="#24180e" stroke-width="5"/><path d="M36 66a14 14 0 0 0 14 14" fill="none" stroke="#24180e" stroke-width="5" stroke-linecap="round"/></svg>';
var HERO_BIG='<p class="big">집 걱정,<br>잠가 드릴게요.</p>';
var INTRO_ONE='<p class="one">설비는 저희가 직접, 그 밖의 집 관리는 믿고 맡길 곳을 찾아 연결해 드립니다.</p>';
var INTRO_HTML='<div class="box hero">'+HERO_BIG+HERO_DECO+'</div>';
var HTYPES=["단독","다세대","아파트","펜션"];
var HEATS=["기름보일러","도시가스","LPG","심야전기","지열","화목","화목·기름 겸용","전기보일러","기타"];
var OIL=["기름보일러","화목","화목·기름 겸용"];
var SVC3=["누수","동파·해빙","하수구"],SVC5=["보일러","수전·위생","도배·장판","타일","싱크대","외부·조경","기타 수리"];
var HRS=["08","09","10","11","12","13","14","15","16","17","18"];
var MAXH=4;
var house=function(id){return S.houses.find(function(h){return h.id===id;});};
var mainHouse=function(){return S.houses[0];};

/* ---------- 카톡 안에서 열린 경우 ---------- */
var UA=navigator.userAgent,IOS=/iPhone|iPad|iPod/.test(UA),AND=/Android/i.test(UA),KAKAO=/KAKAOTALK/i.test(UA);
var INAPP=KAKAO||/NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|BAND\//i.test(UA);
var STANDALONE=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
function openOut(){if(INAPP){goOut();return;}if(KAKAO)location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(PAGE);
  else if(AND)location.href="intent://"+PAGE.replace(/^https:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(PAGE)+";end";
  setTimeout(function(){toast(IOS?"오른쪽 아래 ⋯ 를 누르고 \"Safari로 열기\"를 선택하세요":"화면이 안 바뀌면 ⋮ 를 누르고 \"다른 브라우저로 열기\"를 선택하세요");},1500);}
/* 카톡 등 앱 안에서 열리면 버튼 없이 바로 크롬(아이폰은 사파리)으로 넘김 */
function goOut(){var chrome="intent://"+PAGE.replace(/^https:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;end";
  if(AND){location.href=chrome;if(KAKAO)setTimeout(function(){if(!document.hidden)location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(PAGE);},1500);}
  else if(KAKAO)location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(PAGE);}
if(INAPP&&!STANDALONE){var ia=$("#inapp");ia.hidden=false;ia.innerHTML='<p class="sub">'+(IOS?"사파리":"크롬")+'으로 여는 중이에요… 열리지 않으면 <button type="button" class="lnk" id="outB" style="padding:0">여기를 누르세요</button></p>';$("#outB").onclick=goOut;try{goOut();}catch(e){}}
var installEv=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEv=e;var ae=document.activeElement;if((S.tab==="more"||S.tab==="home")&&!$("#sheetRoot").innerHTML&&!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render();});
window.addEventListener("appinstalled",function(){installEv=null;toast("홈 화면에 추가했어요");render();});
function installGuide(){
  if(installEv){installEv.prompt();installEv.userChoice&&installEv.userChoice.then(function(){installEv=null;render();});return;}
  if(INAPP){openOut();return;}
  var how=IOS?'<ol class="how"><li>화면 아래 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다</li><li><b>"홈 화면에 추가"</b>를 누릅니다</li><li>오른쪽 위 <b>"추가"</b>를 누르면 끝입니다</li></ol>'
   :/SamsungBrowser/i.test(UA)?'<ol class="how"><li>화면 아래 <b>≡</b> 메뉴를 누릅니다</li><li><b>"현재 페이지 추가"</b> → <b>"홈 화면"</b>을 누릅니다</li><li><b>"추가"</b>를 누르면 바탕화면에 아이콘이 생깁니다</li></ol>'
   :'<ol class="how"><li>크롬 오른쪽 위 <b>⋮</b> 메뉴를 누릅니다</li><li><b>"홈 화면에 추가"</b>(또는 "앱 설치")를 누릅니다</li><li><b>"추가"</b> 또는 <b>"설치"</b>를 누르면 끝입니다</li></ol>';
  sheet("앱처럼 쓰기",'<p>홈 화면에 아이콘을 만들어 두면 앱처럼 바로 열 수 있어요.</p>'+how);}

/* ---------- 화면 ---------- */
S.tab=S.tab||"home";if(S.tab==="check")S.tab="house";
var TABS=["home","house","book","more"];
function goTab(t,dir){S.tab=t;closeSheet();render();scrollTo(0,0);var m=$("#main");if(dir&&m.animate){try{m.animate([{transform:"translateX("+(dir*34)+"px)",opacity:.5},{transform:"none",opacity:1}],{duration:170,easing:"ease-out"});}catch(e){}}}
function render(){
  if(!S.me||joinStep===2){$("#tabs").hidden=true;$("#main").innerHTML=vJoin();joinWire();return;}
  if(TABS.indexOf(S.tab)<0)S.tab="home";
  $("#tabs").hidden=false;
  [].forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.classList.toggle("on",b.dataset.tab===S.tab);});
  var t=S.tab;$("#main").innerHTML=t==="house"?vHouses():t==="book"?vBook():t==="more"?vMore():vHome();
  if(t==="book")bookWire();
}
document.addEventListener("click",function(e){var b=e.target.closest("nav.tabs button");if(b){goTab(b.dataset.tab);}});
(function(){var sx=0,sy=0,st=0,ok=false;
  document.addEventListener("touchstart",function(e){ok=false;if($("#tabs").hidden||e.touches.length!==1||$("#sheetRoot").innerHTML)return;var tg=e.target;if(tg.closest&&tg.closest("input,textarea,select,.chips,.cmp,.svc3,.svc5"))return;var p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now();ok=true;},{passive:true});
  document.addEventListener("touchend",function(e){if(!ok)return;ok=false;var p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6)return;var i=TABS.indexOf(S.tab),j=i+(dx<0?1:-1);if(i<0||j<0||j>=TABS.length)return;goTab(TABS[j],dx<0?1:-1);},{passive:true});})();
window.addEventListener("popstate",function(){if($("#sheetRoot").innerHTML){closeSheet();}});

/* ---------- 시트 ---------- */
function sheet(title,html){$("#sheetRoot").innerHTML='<div class="sheet" id="sh"><div class="in" role="dialog" aria-label="'+esc(title)+'"><div class="hd"><h2>'+esc(title)+'</h2><button type="button" class="btn ghost" data-x="1">닫기</button></div>'+html+'</div></div>';
  var sh=$("#sh");sh.onclick=function(e){if(e.target===sh||e.target.dataset.x)closeSheet();};try{history.pushState({s:1},"");}catch(e){}}
function closeSheet(){$("#sheetRoot").innerHTML="";}

/* ---------- 주소 검색 ---------- */
var GUN="강원특별자치도 평창군 ",EM=["평창읍","대화면","봉평면","진부면","방림면","용평면","미탄면","대관령면"];
(function(){var sc=document.createElement("script");sc.src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js";sc.async=true;document.head.appendChild(sc);})();
function addrSearch(cb){
  var em="";
  var root=document.createElement("div");root.className="sheet";root.style.zIndex=40;
  root.innerHTML='<div class="in"><div class="hd"><h2>주소 검색</h2><button type="button" class="btn ghost" data-ax="1">닫기</button></div><div id="pcEmbed" hidden></div><div id="pcFb" style="display:flex;flex-direction:column;gap:10px"><span class="lbl">읍·면</span><div class="chips" id="emC"></div><div class="field"><label for="riIn">리·도로명·번지</label><input id="riIn" placeholder="예) 창동리 123 또는 기풍로 12"></div><button type="button" class="btn" id="riOk">이 주소로 입력</button></div></div>';
  document.body.appendChild(root);var close=function(){root.remove();};
  root.onclick=function(e){if(e.target===root||e.target.dataset.ax)close();};
  if(window.daum&&window.daum.Postcode){root.querySelector("#pcFb").hidden=true;var pe=root.querySelector("#pcEmbed");pe.hidden=false;
    new daum.Postcode({oncomplete:function(d){cb(d.roadAddress||d.jibunAddress);close();},width:"100%",height:"100%"}).embed(pe);}
  else{EM.forEach(function(n){var b=document.createElement("button");b.type="button";b.textContent=n;b.onclick=function(){em=n;[].forEach.call(root.querySelector("#emC").children,function(x){x.classList.toggle("on",x===b);});};root.querySelector("#emC").appendChild(b);});
    root.querySelector("#riOk").onclick=function(){var r=root.querySelector("#riIn").value.trim();if(!em&&!r)return;cb(GUN+(em?em+" ":"")+r);close();};}}

/* ---------- 집 정보 폼 (등록·수정 공용) ---------- */
function stepper(id,label,v){return '<div class="step"><span>'+label+'</span><button type="button" data-st="'+id+'" data-d="-1" aria-label="'+label+' 줄이기">−</button><b id="'+id+'">'+(v||0)+'</b><button type="button" data-st="'+id+'" data-d="1" aria-label="'+label+' 늘리기">+</button></div>';}
function chips(id,list,v){return '<div class="chips" data-chips="'+id+'">'+list.map(function(x){return '<button type="button" data-v="'+esc(x)+'" class="'+(v===x?"on":"")+'">'+esc(x)+'</button>';}).join("")+'</div>';}
function houseForm(h,first){h=h||{};
  return '<div class="field"><label for="hName">집 이름</label><input id="hName" maxlength="20" value="'+esc(h.name||(first?"우리 집":""))+'" placeholder="예) 우리 집, 어머니 댁, 봉평 별장"></div>'
   +'<div class="field"><label for="hAddr">주소</label><div class="addr"><input id="hAddr" readonly placeholder="주소 검색을 눌러 주세요" value="'+esc(h.addr||"")+'"><button type="button" id="hAddrB">주소 검색</button></div><input id="hAddr2" maxlength="100" placeholder="상세 주소 (동·호수, 집 위치 설명)" value="'+esc(h.addr2||"")+'" aria-label="상세 주소"></div>'
   +telField("hTel","이 집 일로 연락받을 번호",h.id?houseTel(h):(S.me?S.me.phone:""),"현장에서 만날 분(대리인)이 따로 있으면 그분 번호를 적어 주세요.");}
function houseInfoForm(h){h=h||{};
  return '<div class="field"><span class="lbl">주택 종류</span>'+chips("type",HTYPES,h.type)+'</div>'
   +'<div class="field"><label for="hArea">전체 크기 (평, 대략)</label><input id="hArea" inputmode="numeric" maxlength="4" value="'+esc(h.area||"")+'" placeholder="예) 30"></div>'
   +'<div class="box" style="gap:8px;padding:10px 12px">'+stepper("hLiving","거실",h.living==null?1:h.living)+stepper("hRooms","방",h.rooms==null?2:h.rooms)+stepper("hBaths","화장실",h.baths==null?1:h.baths)+'</div>'
   +'<div class="field"><span class="lbl">다용도실</span>'+chips("utility",["있음","없음"],h.utility)+'</div>'
   +'<div class="field"><span class="lbl">물</span>'+chips("water",["상수도","지하수"],h.water)+'</div>'
   +'<div class="field"><span class="lbl">하수</span>'+chips("sewage",["정화조","오수합병"],h.sewage)+'<span class="sub">잘 모르시면 비워 두세요</span></div>'
   +'<div class="field"><span class="lbl">난방</span>'+chips("heat",HEATS,h.heat)+'</div>'
   +'<p class="sub">건물 구조, 계량기·메인 밸브 위치처럼 전문가가 봐야 아는 것은 방문할 때 저희가 확인해 기록해 드려요.</p>';}
function wireForms(root){root=root||document;
  [].forEach.call(root.querySelectorAll("[data-chips] button"),function(b){b.onclick=function(){var p=b.parentNode,on=!b.classList.contains("on");[].forEach.call(p.children,function(x){x.classList.remove("on");});if(on)b.classList.add("on");};});
  [].forEach.call(root.querySelectorAll("[data-st]"),function(b){b.onclick=function(){var e=document.getElementById(b.dataset.st);var n=Math.max(0,Math.min(20,(+e.textContent||0)+(+b.dataset.d)));e.textContent=n;};});
  var ab=root.querySelector("#hAddrB");if(ab)ab.onclick=function(){addrSearch(function(a){$("#hAddr").value=a;$("#hAddr2").focus();});};
  var me=root.querySelector("#hMe");if(me)me.onchange=function(){var t=$("#hTel");t.hidden=me.checked;if(!me.checked)t.focus();};}
function chipVal(id){var b=document.querySelector('[data-chips="'+id+'"] button.on');return b?b.dataset.v:"";}
function readHouse(h){h=h||{};var v=function(i){var e=document.getElementById(i);return e?e.value.trim():"";};
  h.name=v("hName")||h.name||"우리 집";h.addr=v("hAddr");h.addr2=v("hAddr2");var t=v("hTel");if(!dg(t)||dg(t)===dg(myPhone())){h.contactMe=true;h.contact="";}else{h.contactMe=false;h.contact=fmtTel(t);}
  return h;}
function readInfo(h){if(!document.querySelector('[data-chips="type"]'))return h;
  h.type=chipVal("type");h.area=document.getElementById("hArea").value.replace(/\D/g,"");h.living=+$("#hLiving").textContent;h.rooms=+$("#hRooms").textContent;h.baths=+$("#hBaths").textContent;
  h.utility=chipVal("utility");h.water=chipVal("water");h.sewage=chipVal("sewage");h.heat=chipVal("heat");h.infoAt=Date.now();return h;}
function infoLine(h){var a=[];if(h.type)a.push(h.type);if(h.area)a.push(h.area+"평");if(h.rooms!=null&&h.infoAt)a.push("방 "+h.rooms);if(h.baths!=null&&h.infoAt)a.push("화장실 "+h.baths);if(h.utility==="있음")a.push("다용도실");if(h.water)a.push(h.water);if(h.sewage)a.push(h.sewage);if(h.heat)a.push(h.heat);return a;}

/* ---------- 연락받을 번호 칸 (입력 + [내 번호]) ---------- */
function myPhone(){return S.me?S.me.phone:fmtTel((($("#jTel")||{}).value||"").trim());}
function telField(id,label,val,hint){return '<div class="field"><label for="'+id+'">'+label+'</label><div class="addr"><input id="'+id+'" type="tel" inputmode="tel" maxlength="20" placeholder="비워 두면 내 번호로 연락드려요" value="'+esc(val||"")+'"><button type="button" data-mytel="'+id+'">내 번호</button></div>'+(hint?'<p class="sub">'+hint+'</p>':'')+'</div>';}
document.addEventListener("click",function(e){var b=e.target.closest("[data-mytel]");if(!b)return;var mp=myPhone();if(dg(mp).length<9){toast("내 전화번호를 먼저 적어 주세요");return;}var i=document.getElementById(b.dataset.mytel);if(i){i.value=mp;i.dispatchEvent(new Event("input",{bubbles:true}));}});
function houseTel(H){return H&&H.contactMe===false&&H.contact?fmtTel(H.contact):(S.me?S.me.phone:"");}

/* ---------- 처음 등록 (등록해야 앱을 씀) ---------- */
var joinStep=1,joinH=null,joinMe=null;
function vJoin(){

  const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++)if(!F[y][xx]&&MF[m](xx,y))M[y][xx]=!M[y][xx];};
  const pen=()=>{let p=0;for(let y=0;y<size;y++){let run=1;for(let xx=1;xx<size;xx++){if(M[y][xx]===M[y][xx-1]){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}
    for(let xx=0;xx<size;xx++){let run=1;for(let y=1;y<size;y++){if(M[y][xx]===M[y-1][xx]){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}
    for(let y=0;y<size-1;y++)for(let xx=0;xx<size-1;xx++){const c=M[y][xx];if(c===M[y][xx+1]&&c===M[y+1][xx]&&c===M[y+1][xx+1])p+=3;}
    let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++;}));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p;};
  let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m;}apply(m);}
  apply(best);fmt(best);return M;
}
function qrCanvas(url,px,caption){var M=qrMake(url);if(!M)return null;var q=4,n=M.length,sc=Math.max(2,Math.floor(px/(n+2*q))),W=sc*(n+2*q),cap=caption?Math.round(W*0.16):0;
